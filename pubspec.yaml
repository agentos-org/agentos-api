name: agentos_api
description: AgentOS API gateway for AgentKit, CronKit, RagKit, ToolKit, AppKit, and ModelKit.
version: 0.4.0
repository: https://github.com/agentos-org/agentos-api

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  shelf: ^1.4.2
  shelf_router: ^1.1.2
  json_annotation: ^4.9.0
  hive: ^2.2.3
  logging: ^1.2.0
  unique_id_dart: ^1.0.0
  pub_semver: ^2.2.0
  liteagent_sdk_dart: ^0.2.9
  opentool_dart: ^2.0.0
  opentool_daemon: ^0.2.2
  agentos_kernel: ^0.1.1

dev_dependencies:
  http: ^1.2.2
  lints: ^6.0.0
  test: ^1.25.6
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
